name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.x"
          elixir-version: "1.20.x"

      # Dialyxir keeps its core PLTs in MIX_HOME and the project PLT in _build.
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix/dialyxir_*.plt
          key: ${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors --force

      - name: Test
        run: mix test --warnings-as-errors --cover

      - name: Credo
        run: mix credo --strict

      - name: Dialyzer
        run: mix dialyzer --format github

      - name: Docs
        run: mix docs
